<!-- 사이트에서 "Edit text"로 고친 문구가 여기에 저장됩니다 (직접 고치지 않아도 돼요) -->
<script id="text-overrides" type="application/json">{}</script>
<script>
(function () {
  try {
    var o = JSON.parse(document.getElementById('text-overrides').textContent || '{}');
    window.SITE_OVERRIDES = o;
    Object.keys(o).forEach(function (p) {
      var ks = p.split('.'), t = window.SITE;
      for (var i = 0; i < ks.length - 1; i++) { if (t == null) return; t = t[ks[i]]; }
      if (t != null) t[ks[ks.length - 1]] = o[p];
    });
  } catch (e) { window.SITE_OVERRIDES = {}; }
})();
</script>
